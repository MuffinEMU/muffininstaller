name: Publish MuffinInstaller

# Builds the install site and deploys it to GitHub Pages. When certs/ has certificates it also signs
# the latest MuffinEMU release with each (zsign) and uploads the signed IPAs to the 'signed' release.
# With an empty certs/ it just publishes the page and the Apple-ID path. No certificates ship here.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily: pick up a new MuffinEMU release and recheck certificate expiry
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore certificates from secrets
        env:
          SLOT1_NAME: ${{ secrets.CERT_SLOT_1_NAME }}
          SLOT1_P12: ${{ secrets.CERT_SLOT_1_P12 }}
          SLOT1_PROV: ${{ secrets.CERT_SLOT_1_PROV }}
          SLOT1_PWD: ${{ secrets.CERT_SLOT_1_PWD }}
          SLOT2_NAME: ${{ secrets.CERT_SLOT_2_NAME }}
          SLOT2_P12: ${{ secrets.CERT_SLOT_2_P12 }}
          SLOT2_PROV: ${{ secrets.CERT_SLOT_2_PROV }}
          SLOT2_PWD: ${{ secrets.CERT_SLOT_2_PWD }}
          SLOT3_NAME: ${{ secrets.CERT_SLOT_3_NAME }}
          SLOT3_P12: ${{ secrets.CERT_SLOT_3_P12 }}
          SLOT3_PROV: ${{ secrets.CERT_SLOT_3_PROV }}
          SLOT3_PWD: ${{ secrets.CERT_SLOT_3_PWD }}
          SLOT4_NAME: ${{ secrets.CERT_SLOT_4_NAME }}
          SLOT4_P12: ${{ secrets.CERT_SLOT_4_P12 }}
          SLOT4_PROV: ${{ secrets.CERT_SLOT_4_PROV }}
          SLOT4_PWD: ${{ secrets.CERT_SLOT_4_PWD }}
          SLOT5_NAME: ${{ secrets.CERT_SLOT_5_NAME }}
          SLOT5_P12: ${{ secrets.CERT_SLOT_5_P12 }}
          SLOT5_PROV: ${{ secrets.CERT_SLOT_5_PROV }}
          SLOT5_PWD: ${{ secrets.CERT_SLOT_5_PWD }}
          SLOT6_NAME: ${{ secrets.CERT_SLOT_6_NAME }}
          SLOT6_P12: ${{ secrets.CERT_SLOT_6_P12 }}
          SLOT6_PROV: ${{ secrets.CERT_SLOT_6_PROV }}
          SLOT6_PWD: ${{ secrets.CERT_SLOT_6_PWD }}
          SLOT7_NAME: ${{ secrets.CERT_SLOT_7_NAME }}
          SLOT7_P12: ${{ secrets.CERT_SLOT_7_P12 }}
          SLOT7_PROV: ${{ secrets.CERT_SLOT_7_PROV }}
          SLOT7_PWD: ${{ secrets.CERT_SLOT_7_PWD }}
          SLOT8_NAME: ${{ secrets.CERT_SLOT_8_NAME }}
          SLOT8_P12: ${{ secrets.CERT_SLOT_8_P12 }}
          SLOT8_PROV: ${{ secrets.CERT_SLOT_8_PROV }}
          SLOT8_PWD: ${{ secrets.CERT_SLOT_8_PWD }}
          SLOT9_NAME: ${{ secrets.CERT_SLOT_9_NAME }}
          SLOT9_P12: ${{ secrets.CERT_SLOT_9_P12 }}
          SLOT9_PROV: ${{ secrets.CERT_SLOT_9_PROV }}
          SLOT9_PWD: ${{ secrets.CERT_SLOT_9_PWD }}
          SLOT10_NAME: ${{ secrets.CERT_SLOT_10_NAME }}
          SLOT10_P12: ${{ secrets.CERT_SLOT_10_P12 }}
          SLOT10_PROV: ${{ secrets.CERT_SLOT_10_PROV }}
          SLOT10_PWD: ${{ secrets.CERT_SLOT_10_PWD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          restored = 0
          for i in range(1, 11):
              name = os.environ.get("SLOT%d_NAME" % i, "")
              if not name:
                  continue
              if "/" in name or "\\" in name or name in (".", ".."):
                  raise SystemExit("refusing unsafe certificate folder name: %r" % name)
              d = pathlib.Path("certs", name)
              d.mkdir(parents=True, exist_ok=True)
              (d / (name + ".p12")).write_bytes(base64.b64decode(os.environ["SLOT%d_P12" % i]))
              (d / (name + ".mobileprovision")).write_bytes(base64.b64decode(os.environ["SLOT%d_PROV" % i]))
              pwd = os.environ.get("SLOT%d_PWD" % i, "")
              if pwd:
                  (d / "password.txt").write_text(pwd)
              restored += 1
          print("restored %d certificate set(s) from secret slots" % restored)
          PY

      - name: Build zsign (only when certificates are present)
        run: |
          set -e
          if compgen -G "certs/*/" > /dev/null; then
            sudo apt-get update && sudo apt-get install -y libssl-dev g++ git
            git clone --depth 1 https://github.com/zhlynn/zsign.git /tmp/zsign
            ( cd /tmp/zsign && g++ -std=c++14 -O2 -o /usr/local/bin/zsign *.cpp common/*.cpp -lcrypto )
            zsign -v || true
          else
            echo "No certificates in certs/; skipping zsign (page + Apple-ID path only)."
          fi

      - name: Build site
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: python3 scripts/build.py

      - name: Upload signed IPAs to the 'signed' release
        if: ${{ hashFiles('signed/*.ipa') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view signed >/dev/null 2>&1 || \
            gh release create signed --title "Signed MuffinEMU builds" --prerelease \
              --notes "Auto-signed per certificate for on-device install. Not an official release."
          gh release upload signed signed/*.ipa --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
